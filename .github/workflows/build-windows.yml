name: Build Windows

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "empacotamento/**"
      - "iniciar.py"
      - "bellracoes/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Telas (dependências)
        run: npm --prefix frontend ci

      - name: Telas (testes)
        run: npm --prefix frontend test

      - name: Telas (build)
        run: npm --prefix frontend run build

      - uses: astral-sh/setup-uv@v6

      - name: Dependências do Python
        run: uv sync --locked --group build

      - name: Testes do backend
        run: uv run pytest fiado/tests -q

      - name: Empacotar com PyInstaller
        run: uv run pyinstaller empacotamento/BellRacoes.spec --noconfirm

      - name: Teste de fumaça do executável
        run: uv run python empacotamento/teste_de_fumaca.py dist/BellRacoes/BellRacoes.exe

      - name: Versão
        id: versao
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "numero=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "numero=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=${{ steps.versao.outputs.numero }}" empacotamento\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: BellRacoes-Setup
          path: dist/BellRacoes-Setup.exe
          if-no-files-found: error

      - name: Publicar em Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/BellRacoes-Setup.exe --title "Bell Rações $env:GITHUB_REF_NAME" --generate-notes
